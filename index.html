        #restartBtn{padding:10px 20px;margin-left:8px;background:#3498db;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer}

        .tip{margin:8px 0;font-size:15px}
        .win{font-size:22px;color:#4cd964;text-align:center;font-weight:bold;margin:20px}
        .lose{font-size:22px;color:#ff5555;text-align:center;font-weight:bold;margin:20px}

#suggestBox {
    box-shadow: 0 4px 12px #0008;
}
#suggestBox div:active {
    background:#555;
}
/* 防止父容器截断下拉框 */
.input-area > div {
    overflow: visible !important;
}

/* ========== 仅手机生效（屏幕宽度≤768px，电脑完全不受影响） ========== */
@media screen and (max-width: 768px) {
    body {
        margin: 15px 0;
        padding: 0 10px;
    }
    h1 {
        font-size: 22px;
    }
    .tip {
        font-size: 14px;
    }
    /* 输入区域自适应，按钮换行 */
    .input-area {
        margin: 16px 0;
    }
    .input-area > div {
        width: 100% !important;
        display: block;
        margin-bottom: 10px;
    }
    #answerInput {
        width: 100% !important;
        font-size: 18px;
        padding: 12px 14px;
    }
    #submitBtn, #restartBtn {
        width: 45%;
        margin: 4px 2px;
        padding: 12px 0;
        font-size: 16px;
    }
    #hintToggleBtn {
        width: 100%;
        padding: 10px;
        font-size: 16px;
    }

    table {

        font-size: 13px;
    }
    th, td {
        padding: 6px 4px;
    }
    /* 统计面板自适应换行 */
    #statPanel div {
        font-size: 14px;
        line-height: 1.6;
    }
    /* 下拉联想框适配手机宽度 */
    #suggestBox {
        width: 100% !important;
    }
    .win, .lose {

    #sideHint {

    }

// 提示框全局可见变量（全局，所有函数都能读取）

let gameOver = false;

let timerId = null;    // 定时器ID，用来停止计时
let startTime = 0;     // 本局开始时间戳
let isTiming = false;  // 是否正在计时标记

// 联想搜索核心函数：输入文本，返回匹配的敌人对象列表
function getMatchList(keyword) {
    const kw = keyword.trim().toLowerCase();
    if (!kw) return [];
    const res = [];
    for (const item of enemyDB) {
        // 1. 本名包含关键词 → 直接匹配
        if (item.name.toLowerCase().includes(kw)) {
            res.push(item);
            continue;
        }
        // 2. 外号包含关键词 → 匹配该敌人的本名
        const aliasHit = item.alias.some(al => al.toLowerCase().includes(kw));
        if (aliasHit) {
            res.push(item);
        }
    }
    // 去重（同一个敌人不会出现多条）
    const unique = [];
    const idSet = new Set();
    for (const e of res) {
        if (!idSet.has(e.name)) {
            idSet.add(e.name);
            unique.push(e);
        }
    }
    return unique;
}

// 渲染下拉联想框
function renderSuggest(keyword) {
    const box = document.getElementById("suggestBox");
    box.innerHTML = "";
    const list = getMatchList(keyword);
    if (list.length === 0 || keyword.trim() === "") {
        box.style.display = "none";
        return;
    }
    box.style.display = "block";
    for (const enemy of list) {
        const div = document.createElement("div");
        div.style.padding = "8px 12px";
        div.style.cursor = "pointer";
        div.style.color = "#eee";
        div.style.borderBottom = "1px solid #444";
        div.onmouseover = () => div.style.background = "#444";
        div.onmouseout = () => div.style.background = "transparent";
        div.onclick = () => {
            // 点击自动填充本名到输入框
            document.getElementById("answerInput").value = enemy.name;
            box.style.display = "none";
        };
        div.innerText = enemy.name;
        box.appendChild(div);
    }
}

// 输入框实时监听联想【已修复函数名bug】
document.getElementById("answerInput").addEventListener("input", (e) => {
    renderSuggest(e.target.value);
});

// 点击页面空白处关闭下拉
document.addEventListener("click", (e) => {
    const input = document.getElementById("answerInput");
    const box = document.getElementById("suggestBox");
    if (!input.contains(e.target) && !box.contains(e.target)) {
        box.style.display = "none";
    }
});

// 格式化秒数为 00:00
function formatSeconds(totalSec){
    const m = Math.floor(totalSec / 60).toString().padStart(2,"0");
    const s = (totalSec % 60).toString().padStart(2,"0");
    return `${m}:${s}`;
}

// 实时刷新计时文本
function updateTimerDisplay(){
    if(!isTiming) return;
    const diff = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById("timeText").innerText = formatSeconds(diff);
}

// 游戏状态
// 游戏状态
let guessCount = 0;
let guessHistory = []; // 存储本局所有猜测记录
// ========== 新增统计全局变量与函数 ==========
let stat = JSON.parse(localStorage.getItem("ak_guess_stat")) || {
    totalGame: 0,    // 总对局
    winGame: 0,       // 胜利对局
    currentStreak: 0, // 当前连胜
    maxStreak: 0      // 历史最高连胜
};
// 更新统计面板
function renderStatPanel(){
    const total = stat.totalGame;
    const win = stat.winGame;
    let rate = total === 0 ? "0.00%" : ((win / total)*100).toFixed(2)+"%";
    document.getElementById("statPanel").innerHTML = `
        <div style="padding:10px;border:1px solid #444;border-radius:6px;margin-bottom:12px;">
            📊对局统计：总对局 ${total}｜胜利 ${win}｜正确率 ${rate}<br>
            🔥当前连胜：${stat.currentStreak} ｜🏆最高连胜：${stat.maxStreak}
            <button onclick="resetStat()" style="margin-left:10px;padding:3px 8px;background:#444;color:#fff;border:0;border-radius:4px;">清空统计</button>
        </div>
    `;
}
// 重置统计数据
function resetStat(){
    stat = {
        totalGame:0,
        winGame:0,
        currentStreak:0,
        maxStreak:0
    };
    localStorage.setItem("ak_guess_stat", JSON.stringify(stat));
    renderStatPanel();
}
// 保存统计到本地
function saveStat(){
    localStorage.setItem("ak_guess_stat", JSON.stringify(stat));
}
// 刷新次数提示
function refreshCountTip(){
    document.getElementById("countTip").innerText = `猜测次数：${guessCount} / ${MAX_GUESS}`;
}

// 初始化新一局游戏（重启函数）
function initNewGame(){
    // 重置计时器
    if(timerId !== null) clearInterval(timerId);
    timerId = null;
    isTiming = false;
    document.getElementById("timeText").innerText = "00:00";
    gameOver = false;
    guessCount = 0;
    guessHistory = [];
    document.getElementById("msgBox").innerHTML = "";
    document.getElementById("historyBox").innerHTML = "";
    document.getElementById("answerInput").value = "";
    document.getElementById("answerInput").disabled = false;
    document.getElementById("sideHint").innerText = "提示区域：暂无线索";
    // ✅在函数内部获取DOM元素
    const hintBox = document.getElementById("sideHint");
    const hintBtn = document.getElementById("hintToggleBtn");
    hintBox.style.display = hintVisible ? "block" : "none";
    hintBtn.innerText = hintVisible ? "隐藏提示" : "显示提示";
    pickTarget();
}

// 随机选取目标敌人
function pickTarget(){
    const rnd = Math.floor(Math.random() * enemyDB.length);
    targetEnemy = enemyDB[rnd];
    // console.log("答案:", targetEnemy.name); // 调试用，发布前注释
    refreshCountTip();
}

// 名称匹配检测
function checkName(inputStr){
    const s = inputStr.trim().toLowerCase();
    if(targetEnemy.name.toLowerCase() === s) return true;
    for(let a of targetEnemy.alias){
        if(a.toLowerCase() === s) return true;
    }
    return false;
}

// 根据属性对比获取样式和文字
function getAttrResult(targetVal, guessVal, attr){
    if(attr.type === "number"){
        if(targetVal === guessVal){
            return {cls:"right",text:`${guessVal}`};
        }else if(guessVal < targetVal){
            // 猜的数字更小，需要往上猜 ↑
            return {cls:"near",text:`${guessVal} ↑`};
        }else{
            // 猜的数字更大，需要往下猜 ↓
            return {cls:"near",text:`${guessVal} ↓`};
        }
    }else{
        if(targetVal === guessVal){
            return {cls:"right",text:`${guessVal}`};
        }else{
            return {cls:"wrong",text:`${guessVal}`};
        }
    }
}
// 渲染完整历史表格
function renderHistoryTable(){
    const box = document.getElementById("historyBox");
    if(guessHistory.length === 0){
        box.innerHTML = "";
        return;
    }
    // 表头
    let html = `<table>
    <tr>
        <th>轮次</th>
        <th>猜测敌人</th>`;
    for(let attr of attrInfo){
        html += `<th>${attr.name}</th>`;
    }
    html += `</tr>`;

    // 逐行填充历史猜测
    for(let record of guessHistory){
        html += `<tr>`;
        html += `<td>${record.round}</td>`;
        html += `<td>${record.enemyName}</td>`;
        for(let attr of attrInfo){
            const res = getAttrResult(targetEnemy[attr.key], record.data[attr.key], attr);
            html += `<td class="${res.cls}">${res.text}</td>`;
        }
        html += `</tr>`;
    }
    html += `</table>`;
    box.innerHTML = html;
}

function submit(){
    if(gameOver) return;
    const input = document.getElementById("answerInput").value.trim();
// 首次提交，开启计时器
    if(!isTiming){
        startTime = Date.now();
        isTiming = true;
        timerId = setInterval(updateTimerDisplay, 1000);
    }
    const msgBox = document.getElementById("msgBox");
    if(!input){
        msgBox.innerHTML = `<div style="color:#fa4">请输入敌人名称！</div>`;
        return;
    }

    // 查找猜测的敌人
    const guessEnemy = enemyDB.find(e=>{
        if(e.name.toLowerCase() === input.toLowerCase()) return true;
        for(let a of e.alias) if(a.toLowerCase() === input.toLowerCase()) return true;
        return false;
    });
    if(!guessEnemy){
        msgBox.innerHTML = `<div style="color:#f66">未找到该敌人，请检查名称！</div>`;
        return;
    }
    guessCount++;
    refreshCountTip();

    // 存入历史记录
    guessHistory.push({
        round: guessCount,
        enemyName: guessEnemy.name,
        data: {...guessEnemy}
    });
    renderHistoryTable();

    // 判断猜对
if(checkName(input)){
    // 停止计时
    clearInterval(timerId);
    isTiming = false;
    const usedSec = Math.floor((Date.now() - startTime)/1000);
    gameOver = true;
    msgBox.innerHTML = `<div class="win">恭喜！猜对了！目标敌人：【${targetEnemy.name}】;<br>本局用时：${formatSeconds(usedSec)}</div>`;
    document.getElementById("answerInput").disabled = true;
    stat.winGame += 1; //✅胜利+1
    stat.totalGame += 1;
// 胜利：当前连胜+1，刷新最高连胜
stat.currentStreak += 1;
if (stat.currentStreak > stat.maxStreak) {
    stat.maxStreak = stat.currentStreak;
}
    saveStat();
    renderStatPanel();
    return;
}

    msgBox.innerHTML = `<div style="color:#f88">错了，再来一次</div>`;
// ============新增提示代码开始============
const target = targetEnemy;
let hintText = "提示区域：暂无线索";
if (guessCount >= 3) {
    hintText = `线索1：该敌人是否有多阶段：${target.multiStage}`;
}
if (guessCount >= 6) {
    hintText += `\n线索2：该敌人首次登场：${target.firstShow}`;
}
document.getElementById("sideHint").innerText = hintText;
// ============新增提示代码结束============


  //判断次数用尽
if(guessCount >= MAX_GUESS){
    // 停止计时
    clearInterval(timerId);
    isTiming = false;
    const usedSec = Math.floor((Date.now() - startTime)/1000);
    gameOver = true;
    msgBox.innerHTML += `<div class="lose">次数耗尽，游戏结束！正确敌人：【${targetEnemy.name}】;<br>本局用时：${formatSeconds(usedSec)}</div>`;
    document.getElementById("answerInput").disabled = true;
    stat.totalGame += 1; // 失败也计入总对局
// 失败，清空当前连胜
    stat.currentStreak = 0;
    saveStat();
    renderStatPanel();
    return;
}

// 提交成功后清空输入框 + 关闭联想下拉
document.getElementById("answerInput").value = "";
document.getElementById("suggestBox").style.display = "none";
}
window.onload = ()=>{
    // 页面加载完成后再获取提示按钮与提示框
    const hintBtn = document.getElementById("hintToggleBtn");
    const hintBox = document.getElementById("sideHint");
    // 完整双向切换文字+显隐逻辑
    hintBtn.addEventListener("click", ()=>{
        hintVisible = !hintVisible;
        if(hintVisible){
            hintBox.style.display = "block";
            hintBtn.innerText = "隐藏提示";
        }else{
            hintBox.style.display = "none";
            hintBtn.innerText = "显示提示"; // 补齐缺失文字切换
        }
    });
// 统一计算并刷新界面显示
function refreshWinRateDisplay(){
    // stat.winGame 胜利场数
    // stat.loseGame 失败场数
    const totalGame = stat.winGame + stat.loseGame;
    let rate = 0;
    if(totalGame > 0){
        rate = (stat.winGame / totalGame * 100).toFixed(1);
    }
    // 找到页面显示胜率的DOM，更新文字
    document.getElementById("winRateText").innerText = `胜率：${rate}%`;
}
    initNewGame();
    document.getElementById("submitBtn").addEventListener("click", submit);
    document.getElementById("restartBtn").addEventListener("click", initNewGame);
    document.getElementById("answerInput").addEventListener("keydown",e=>{
        if(e.key === "Enter") submit();
    })
renderStatPanel();
}
